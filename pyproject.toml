[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-research"
version = "0.1.0"
description = "An agentic deep-research workspace that navigates, dives, verifies, and synthesizes."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=0.49",
    "fastapi>=0.115",
    "fastmcp>=3.4",
    "jieba>=0.42",
    "json-repair>=0.61",
    "langgraph>=0.5",
    "mcp>=1.27",
    "openai>=1.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "qdrant-client>=1.15",
    "sentence-transformers>=5.0",
    "tavily-python>=0.7",
    "tiktoken>=0.13",
    "torch==2.12.0",
    "trafilatura>=2.0",
    "uvicorn>=0.34",
    "PyMuPDF>=1.26",
]

[project.scripts]
iceberg-research = "main:main"
iceberg-terminal = "terminal_gui:main"
iceberg-library = "library_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.setuptools]
py-modules = ["main", "terminal_gui", "library_cli", "server"]

[tool.setuptools.packages.find]
include = ["iceberg_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
